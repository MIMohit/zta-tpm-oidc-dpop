<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>REMOTE-WORK :: SECURE TERMINAL</title>
  <script src="https://unpkg.com/@simplewebauthn/browser/dist/bundle/index.umd.min.js"></script>

  <style>
    /* ===== 90s CYBER TERMINAL THEME ===== */

    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top, #001400, #000000 80%);
      color: #00ff66;
      font-family: "Courier New", Courier, monospace;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .terminal {
      width: 820px;
      max-width: 95%;
      background: rgba(0, 0, 0, 0.92);
      border: 2px solid #00ff66;
      box-shadow:
        0 0 20px #00ff66,
        inset 0 0 30px rgba(0, 255, 102, 0.15);
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    /* Scanlines */
    .terminal::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 255, 102, 0.05),
        rgba(0, 255, 102, 0.05) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
    }

    .header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .header span {
      color: #00ffaa;
    }

    .title {
      font-weight: bold;
      letter-spacing: 2px;
    }

    .status {
      color: #ffcc00;
    }

    hr {
      border: none;
      border-top: 1px solid #00ff66;
      margin: 10px 0;
    }

    .output {
      background: #000;
      border: 1px solid #00ff66;
      padding: 10px;
      min-height: 160px;
      white-space: pre-wrap;
      font-size: 14px;
      overflow-y: auto;
    }

    .cursor::after {
      content: "█";
      animation: blink 1s infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .btn {
      margin-top: 15px;
      background: transparent;
      color: #00ff66;
      border: 1px solid #00ff66;
      padding: 10px 16px;
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn:hover {
      background: #00ff66;
      color: #000;
      box-shadow: 0 0 10px #00ff66;
    }

    .mfa-box {
      display: none;
      margin-top: 15px;
      border: 1px dashed #ffcc00;
      padding: 10px;
    }

    .mfa-box input {
      width: 100%;
      background: black;
      color: #00ff66;
      border: 1px solid #00ff66;
      padding: 6px;
      margin-top: 6px;
      font-family: inherit;
    }

    .warning {
      color: #ff5555;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="terminal">
  <div class="header">
    <span class="title">REMOTE-WORK TERMINAL</span>
    <span class="status">SECURE MODE</span>
  </div>

  <hr>

  <div class="output cursor" id="output">
Initializing secure channel...
Awaiting operator command...
  </div>

  <button class="btn" onclick="requestAudit()">ACCESS CLASSIFIED INFO</button>

  <div class="mfa-box" id="mfa-box">
    <p class="warning">⚠ MULTI-FACTOR AUTH REQUIRED</p>
    <p style="margin-bottom: 10px;">Please authenticate using your registered biometric or security key.</p>
    <button class="btn" id="mfa-verify-btn" onclick="submitMFA()">VERIFY IDENTITY (SECURITY KEY)</button>
  </div>
</div>

<script>
const AGENT_URL = "http://127.0.0.1:7000";

async function requestAudit() {
  const out = document.getElementById("output");
  out.textContent = "Connecting to client TPM agent...\nRequesting protected audit report...";

  try {
    const res = await fetch(`${AGENT_URL}/agent/resource/company.audit`);
    const data = await res.json();

    if (data.step_up || data.stepUp) {
      out.textContent = "⚠ MULTI-FACTOR AUTH REQUIRED (Step-Up)\nResource sensitivity: HIGH\nCurrent authentication: acr=pwd\nElevated credentials required.";
      document.getElementById("mfa-box").style.display = "block";
      return;
    }

    if (res.status === 403) {
      out.textContent = `❌ Access denied: ${data.reason || data.error || "Policy Denied"}`;
      document.getElementById("mfa-box").style.display = "none";
      return;
    }

    if (!res.ok) {
      out.textContent = `❌ Request failed (${res.status}): ${data.message || data.error || res.statusText}`;
      return;
    }

    document.getElementById("mfa-box").style.display = "none";
    out.textContent = JSON.stringify(data, null, 2);
  } catch (err) {
    out.textContent = `❌ Agent communication error: ${err.message}`;
  }
}

async function submitMFA() {
  const out = document.getElementById("output");
  const verifyBtn = document.getElementById("mfa-verify-btn");
  verifyBtn.disabled = true;
  verifyBtn.textContent = "INITIATING STEP-UP AUTHENTICATION...";

  try {
    const res = await fetch(`${AGENT_URL}/agent/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ acr_values: "mfa" }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.message || err.error || "Step-up login request failed");
    }

    const data = await res.json();
    const authorizeUrl = data.authorize_url || data.authorizeUrl;
    if (!authorizeUrl) {
      throw new Error("No authorization URL returned by agent");
    }

    // Redirect to IdP authorization endpoint which evaluates acr_values=mfa and routes to stepup.html
    window.location.href = authorizeUrl;
  } catch (err) {
    alert("MFA step-up initiation failed: " + err.message);
    verifyBtn.disabled = false;
    verifyBtn.textContent = "VERIFY IDENTITY (SECURITY KEY)";
  }
}
</script>


</body>
</html>
